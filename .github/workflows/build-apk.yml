name: Compilar APK desde HTML (Completo)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'www/**'
      - 'assets/**'
      - 'capacitor.config.json'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar código del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 3. Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Instalar dependencias de Capacitor y Assets
        run: npm install

      - name: 5. Generar proyecto nativo Android
        run: npx cap add android

      - name: 6. Generar iconos y pantalla de carga (Splash Screen) si existen en assets/
        run: |
          if [ -f "assets/icon-only.png" ] || [ -f "assets/logo.png" ]; then
            npx capacitor-assets generate --android
          else
            echo "No se encontraron iconos personalizados en assets/, usando iconos por defecto."
          fi

      - name: 7. Inyectar permisos (Cámara, Micrófono, Almacenamiento) y soporte de descargas
        run: |
          python3 - << 'EOF'
          import os, re
          from pathlib import Path

          manifest_path = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest_path.read_text(encoding="utf-8")

          permissions = '''
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.microphone" android:required="false" />
          '''
          if "android.permission.CAMERA" not in content:
              content = content.replace("<application", permissions + "\n    <application", 1)
          manifest_path.write_text(content, encoding="utf-8")

          # Localizar MainActivity.java o MainActivity.kt y añadir soporte WebChromeClient (permisos webRTC) y DownloadListener
          main_files = list(Path("android/app/src/main/java").rglob("MainActivity.*"))
          for mf in main_files:
              pkg_line = mf.read_text(encoding="utf-8").splitlines()[0]
              if mf.suffix == ".java":
                  java_code = f'''{pkg_line}

          import android.Manifest;
          import android.app.DownloadManager;
          import android.content.Context;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.util.Base64;
          import android.webkit.DownloadListener;
          import android.webkit.PermissionRequest;
          import android.webkit.URLUtil;
          import android.webkit.WebChromeClient;
          import android.widget.Toast;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends BridgeActivity {{
              @Override
              public void onCreate(Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);
                  requestRuntimePermissions();
              }}

              @Override
              public void onStart() {{
                  super.onStart();
                  if (this.bridge != null && this.bridge.getWebView() != null) {{
                      this.bridge.getWebView().setWebChromeClient(new WebChromeClient() {{
                          @Override
                          public void onPermissionRequest(final PermissionRequest request) {{
                              runOnUiThread(() -> request.grant(request.getResources()));
                          }}
                      }});

                      this.bridge.getWebView().setDownloadListener(new DownloadListener() {{
                          @Override
                          public void onDownloadStart(String url, String userAgent, String contentDisposition, String mimeType, long contentLength) {{
                              try {{
                                  if (url.startsWith("data:")) {{
                                      saveBase64File(url, mimeType);
                                  }} else if (url.startsWith("blob:")) {{
                                      String js = "javascript:(function(){{" +
                                          "var xhr = new XMLHttpRequest();" +
                                          "xhr.open('GET', '" + url + "', true);" +
                                          "xhr.responseType = 'blob';" +
                                          "xhr.onload = function() {{" +
                                              "var reader = new FileReader();" +
                                              "reader.readAsDataURL(xhr.response);" +
                                              "reader.onloadend = function() {{" +
                                                  "window.location.href = reader.result;" +
                                              "}};" +
                                          "}};" +
                                          "xhr.send();" +
                                      "}})()";
                                      bridge.getWebView().loadUrl(js);
                                  }} else {{
                                      DownloadManager.Request request = new DownloadManager.Request(Uri.parse(url));
                                      request.setMimeType(mimeType);
                                      String fileName = URLUtil.guessFileName(url, contentDisposition, mimeType);
                                      request.setTitle(fileName);
                                      request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                                      request.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, fileName);
                                      DownloadManager dm = (DownloadManager) getSystemService(DOWNLOAD_SERVICE);
                                      dm.enqueue(request);
                                      Toast.makeText(getApplicationContext(), "Descargando " + fileName, Toast.LENGTH_SHORT).show();
                                  }}
                              }} catch (Exception e) {{
                                  Toast.makeText(getApplicationContext(), "Error al descargar: " + e.getMessage(), Toast.LENGTH_LONG).show();
                              }}
                          }}
                      }});
                  }}
              }}

              private void saveBase64File(String dataUrl, String mimeType) {{
                  try {{
                      String base64Data = dataUrl.substring(dataUrl.indexOf(",") + 1);
                      byte[] fileBytes = Base64.decode(base64Data, Base64.DEFAULT);
                      String ext = "bin";
                      if (dataUrl.contains("application/json")) ext = "json";
                      else if (dataUrl.contains("text/plain")) ext = "txt";
                      else if (dataUrl.contains("text/csv")) ext = "csv";
                      else if (dataUrl.contains("text/html")) ext = "html";
                      else if (dataUrl.contains("application/sla") || dataUrl.contains("octet-stream")) ext = "stl";
                      else if (dataUrl.contains("image/png")) ext = "png";
                      else if (dataUrl.contains("image/jpeg")) ext = "jpg";

                      String fileName = "archivo_" + System.currentTimeMillis() + "." + ext;
                      File downloadsDir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                      File outFile = new File(downloadsDir, fileName);
                      FileOutputStream fos = new FileOutputStream(outFile);
                      fos.write(fileBytes);
                      fos.close();
                      Toast.makeText(this, "Guardado en Descargas: " + fileName, Toast.LENGTH_LONG).show();
                  }} catch (Exception e) {{
                      Toast.makeText(this, "Error guardando archivo: " + e.getMessage(), Toast.LENGTH_LONG).show();
                  }}
              }}

              private void requestRuntimePermissions() {{
                  String[] perms = new String[]{{
                      Manifest.permission.CAMERA,
                      Manifest.permission.RECORD_AUDIO
                  }};
                  List<String> needed = new ArrayList<>();
                  for (String p : perms) {{
                      if (ContextCompat.checkSelfPermission(this, p) != PackageManager.PERMISSION_GRANTED) {{
                          needed.add(p);
                      }}
                  }}
                  if (!needed.isEmpty()) {{
                      ActivityCompat.requestPermissions(this, needed.toArray(new String[0]), 1001);
                  }}
              }}
          }}
          '''
                  mf.write_text(java_code, encoding="utf-8")
                  print("MainActivity.java parcheado con éxito.")
          EOF

      - name: 8. Sincronizar archivos web en Android
        run: npx cap sync android

      - name: 9. Compilar APK con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 10. Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: Aplicacion-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
